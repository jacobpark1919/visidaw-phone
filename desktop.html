<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>VisiDAW WebRTC receiver</title>
    <meta name="theme-color" content="#0a090c" />
    <link rel="stylesheet" href="/theme.css" />
    <style>
      main { width: min(960px, calc(100vw - 24px)); padding: 12px; }
      video { aspect-ratio: 16 / 9; }

      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 12px;
        margin-bottom: 12px;
      }

      .identity { display: flex; align-items: center; flex-wrap: wrap; gap: 12px; }
      #status { margin: 12px 0 0; overflow-wrap: anywhere; }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div class="identity">
          <h1 class="brand">VisiDAW</h1>
          <span class="page-label">Camera receiver</span>
        </div>
        <button id="start">Start Receiver</button>
      </header>
      <video id="remote" autoplay muted playsinline controls></video>
      <p id="status" role="status" aria-live="polite">Waiting. Session: <code id="session"></code></p>
    </main>

    <script src="/recorder-protocol.js"></script>
    <script>
      const params = new URLSearchParams(window.location.search);
      const session = params.get("session") || params.get("s") || "manual";
      const embed = params.get("embed") === "1";
      const autoStart = params.get("auto") === "1";
      const remote = document.getElementById("remote");
      const button = document.getElementById("start");
      const status = document.getElementById("status");
      const sessionLabel = document.getElementById("session");
      const iceServers = [{ urls: "stun:stun.l.google.com:19302" }];
      let peer = null;
      let offerApplied = false;
      let answerPosted = false;
      let queuedCandidates = [];
      let remoteStream = null;
      let mediaRecorder = null;
      let recorderStopRequested = false;
      let pendingChunkReads = 0;
      let recorderBytesSent = 0;
      let nextRecorderChunkSequence = 0;
      let recorderStartedAtMs = 0;
      let firstRecorderMediaTimeSeconds = null;
      let lastRecorderMediaTimeSeconds = null;
      let lastObservedCaptureTimeMs = null;
      let recorderFrameIntervalsSeconds = [];
      let recorderFrameMonitorActive = false;
      let pendingCaptureBoundaryStop = null;
      let captureBoundaryFallbackTimer = null;
      let captureBoundaryHardTimer = null;
      let activeVisiDAWRecordingTakeId = null;
      const addedPhoneCandidates = new Set();

      window.visidawRecorderProtocolVersion = 2;

      sessionLabel.textContent = session;

      if (embed) {
        document.body.style.placeItems = "stretch";
        document.querySelector("main").style.width = "100%";
        document.querySelector("main").style.minHeight = "100vh";
        document.querySelector("main").style.display = "grid";
        document.querySelector("main").style.gridTemplateRows = "auto 1fr auto";
        document.querySelector("main").style.padding = "0";
        document.querySelector("header").style.padding = "10px";
        document.querySelector("header").style.marginBottom = "0";
        remote.style.borderRadius = "0";
        remote.style.borderLeft = "0";
        remote.style.borderRight = "0";
        status.style.padding = "0 10px 10px";
      }

      function setStatus(message, kind = "") {
        status.textContent = message + " Session: " + session;
        status.className = kind;
      }

      function emitToVisiDAW(payload) {
        if (payload && activeVisiDAWRecordingTakeId !== null && payload.takeId === undefined) {
          payload.takeId = activeVisiDAWRecordingTakeId;
        }

        if (window.__JUCE__ && window.__JUCE__.backend) {
          window.__JUCE__.backend.emitEvent("visidawWebRtcVideo", payload);
        }
      }

      function normaliseTimestampMs(value) {
        if (typeof value !== "number" || !Number.isFinite(value)) {
          return null;
        }

        return value > 100000000000 ? value - performance.timeOrigin : value;
      }

      function validDurationMs(value) {
        return typeof value === "number" && Number.isFinite(value) && value >= 0 && value <= 2000;
      }

      function emitFrameTiming(metadata) {
        const presentationMs = normaliseTimestampMs(metadata && metadata.presentationTime);
        const captureMs = normaliseTimestampMs(metadata && metadata.captureTime);
        const receiveMs = normaliseTimestampMs(metadata && metadata.receiveTime);
        const captureToPresentMs = presentationMs !== null && captureMs !== null
          ? presentationMs - captureMs
          : null;
        const receiveToPresentMs = presentationMs !== null && receiveMs !== null
          ? presentationMs - receiveMs
          : null;
        let videoLatencyMs = validDurationMs(captureToPresentMs) ? captureToPresentMs : null;

        if (videoLatencyMs === null && validDurationMs(receiveToPresentMs)) {
          videoLatencyMs = receiveToPresentMs;
        }

        if (videoLatencyMs === null) {
          return;
        }

        emitToVisiDAW({
          type: "timing",
          source: "requestVideoFrameCallback",
          videoLatencyMs,
          captureToPresentMs,
          receiveToPresentMs,
          mediaTimeSeconds: typeof metadata.mediaTime === "number" ? metadata.mediaTime : null,
          presentedFrames: typeof metadata.presentedFrames === "number" ? metadata.presentedFrames : null
        });
      }

      function samplePhoneSyncFrames() {
        if (!remote || typeof remote.requestVideoFrameCallback !== "function") {
          emitToVisiDAW({
            type: "timingUnavailable",
            reason: !remote ? "video element not found" : "requestVideoFrameCallback unavailable"
          });
          return;
        }

        let samplesRemaining = 24;
        const onFrame = (_now, metadata) => {
          emitFrameTiming(metadata || {});
          samplesRemaining -= 1;

          if (samplesRemaining > 0) {
            remote.requestVideoFrameCallback(onFrame);
          }
        };

        remote.requestVideoFrameCallback(onFrame);
      }

      function getRecorderMimeType() {
        const candidates = [
          "video/webm;codecs=vp9",
          "video/webm;codecs=vp8",
          "video/webm"
        ];

        for (const mimeType of candidates) {
          if (window.MediaRecorder && MediaRecorder.isTypeSupported(mimeType)) {
            return mimeType;
          }
        }

        return "";
      }

      function maybeEmitRecorderStopped() {
        if (!recorderStopRequested || pendingChunkReads > 0) {
          return;
        }

        const timing = window.VisiDAWRecorderProtocol.calculateDuration(
          firstRecorderMediaTimeSeconds,
          lastRecorderMediaTimeSeconds,
          recorderFrameIntervalsSeconds,
          (performance.now() - recorderStartedAtMs) / 1000
        );
        recorderStopRequested = false;
        mediaRecorder = null;
        setStatus("WebRTC video saved.", "ok");
        emitToVisiDAW({
          type: "stopped",
          chunkCount: nextRecorderChunkSequence,
          bytes: recorderBytesSent,
          sourceDurationSeconds: timing.sourceDurationSeconds,
          finalFrameIntervalSeconds: timing.finalFrameIntervalSeconds
        });
        activeVisiDAWRecordingTakeId = null;
      }

      function clearCaptureBoundaryTimers() {
        if (captureBoundaryFallbackTimer) {
          clearTimeout(captureBoundaryFallbackTimer);
          captureBoundaryFallbackTimer = null;
        }
        if (captureBoundaryHardTimer) {
          clearTimeout(captureBoundaryHardTimer);
          captureBoundaryHardTimer = null;
        }
      }

      function stopMediaRecorderNow() {
        pendingCaptureBoundaryStop = null;
        clearCaptureBoundaryTimers();
        if (mediaRecorder && mediaRecorder.state !== "inactive") {
          mediaRecorder.stop();
        }
      }

      function observeRecorderFrame(_now, metadata = {}) {
        if (!mediaRecorder || mediaRecorder.state === "inactive") {
          recorderFrameMonitorActive = false;
          return;
        }

        const mediaTime = Number(metadata.mediaTime);
        if (Number.isFinite(mediaTime)) {
          if (firstRecorderMediaTimeSeconds === null) {
            firstRecorderMediaTimeSeconds = mediaTime;
          }
          if (lastRecorderMediaTimeSeconds !== null) {
            const interval = mediaTime - lastRecorderMediaTimeSeconds;
            if (interval > 0 && interval < 1) {
              recorderFrameIntervalsSeconds.push(interval);
              if (recorderFrameIntervalsSeconds.length > 61) {
                recorderFrameIntervalsSeconds.shift();
              }
            }
          }
          lastRecorderMediaTimeSeconds = mediaTime;
        }

        const captureTimeMs = normaliseTimestampMs(metadata.captureTime);
        if (captureTimeMs !== null) {
          lastObservedCaptureTimeMs = captureTimeMs;
        }

        if (pendingCaptureBoundaryStop
            && window.VisiDAWRecorderProtocol.captureBoundaryReached(
              captureTimeMs,
              pendingCaptureBoundaryStop.targetCaptureTimeMs
            )) {
          stopMediaRecorderNow();
          return;
        }

        remote.requestVideoFrameCallback(observeRecorderFrame);
      }

      function beginRecorderFrameMonitor() {
        if (recorderFrameMonitorActive
            || !remote
            || typeof remote.requestVideoFrameCallback !== "function") {
          return;
        }
        recorderFrameMonitorActive = true;
        remote.requestVideoFrameCallback(observeRecorderFrame);
      }

      function getActiveRemoteStream() {
        if (remoteStream) {
          return remoteStream;
        }

        if (remote.srcObject instanceof MediaStream) {
          return remote.srcObject;
        }

        return null;
      }

      window.visidawStartWebRtcRecording = (takeId = null) => {
        try {
          const numericTakeId = Number(takeId);
          activeVisiDAWRecordingTakeId = Number.isFinite(numericTakeId) && numericTakeId > 0
            ? numericTakeId
            : null;

          const streamToRecord = getActiveRemoteStream();

          if (!streamToRecord) {
            throw new Error("No WebRTC stream is connected yet");
          }

          if (!window.MediaRecorder) {
            throw new Error("MediaRecorder is not available in this WebView");
          }

          if (mediaRecorder && mediaRecorder.state !== "inactive") {
            return;
          }

          const liveVideoTracks = streamToRecord
            .getVideoTracks()
            .filter((track) => track.readyState === "live");

          if (liveVideoTracks.length === 0) {
            throw new Error("The connected phone stream has no live video track");
          }

          const mimeType = getRecorderMimeType();
          mediaRecorder = mimeType
            ? new MediaRecorder(streamToRecord, { mimeType })
            : new MediaRecorder(streamToRecord);
          recorderStopRequested = false;
          clearCaptureBoundaryTimers();
          pendingCaptureBoundaryStop = null;
          pendingChunkReads = 0;
          recorderBytesSent = 0;
          nextRecorderChunkSequence = 0;
          recorderStartedAtMs = performance.now();
          firstRecorderMediaTimeSeconds = null;
          lastRecorderMediaTimeSeconds = null;
          lastObservedCaptureTimeMs = null;
          recorderFrameIntervalsSeconds = [];
          samplePhoneSyncFrames();

          mediaRecorder.ondataavailable = (event) => {
            if (!event.data || event.data.size === 0) {
              return;
            }

            recorderBytesSent += event.data.size;
            const sequence = nextRecorderChunkSequence++;
            pendingChunkReads += 1;
            const reader = new FileReader();
            reader.onload = () => {
              const result = String(reader.result || "");
              const commaIndex = result.indexOf(",");
              emitToVisiDAW({
                type: "chunk",
                sequence,
                data: commaIndex >= 0 ? result.slice(commaIndex + 1) : result
              });
              pendingChunkReads -= 1;
              maybeEmitRecorderStopped();
            };
            reader.onerror = () => {
              pendingChunkReads -= 1;
              emitToVisiDAW({
                type: "error",
                message: "Could not read WebRTC recording chunk"
              });
              maybeEmitRecorderStopped();
            };
            reader.readAsDataURL(event.data);
          };

          mediaRecorder.onstop = () => {
            recorderStopRequested = true;
            setStatus("Finishing WebRTC video.", "ok");
            maybeEmitRecorderStopped();
          };

          mediaRecorder.onerror = (event) => {
            recorderStopRequested = false;
            pendingCaptureBoundaryStop = null;
            clearCaptureBoundaryTimers();
            mediaRecorder = null;
            emitToVisiDAW({
              type: "error",
              message: event.error ? event.error.message : "MediaRecorder error"
            });
            activeVisiDAWRecordingTakeId = null;
          };

          mediaRecorder.start(1000);
          beginRecorderFrameMonitor();
          setStatus("Recording WebRTC video.", "ok");
          emitToVisiDAW({ type: "started" });
          setTimeout(samplePhoneSyncFrames, 120);
          setTimeout(samplePhoneSyncFrames, 600);
        } catch (error) {
          emitToVisiDAW({
            type: "error",
            message: error.message || error.name
          });
          activeVisiDAWRecordingTakeId = null;
        }
      };

      window.visidawStopWebRtcRecording = (options = {}) => {
        try {
          if (!mediaRecorder || mediaRecorder.state === "inactive") {
            recorderStopRequested = false;
            emitToVisiDAW({
              type: "stopped",
              chunkCount: nextRecorderChunkSequence,
              bytes: recorderBytesSent,
              sourceDurationSeconds: Math.max(0, (performance.now() - recorderStartedAtMs) / 1000),
              finalFrameIntervalSeconds: 0
            });
            activeVisiDAWRecordingTakeId = null;
            return;
          }

          if (!options || options.waitForCaptureBoundary !== true) {
            stopMediaRecorderNow();
            return;
          }

          const requestedAtMs = performance.now();
          const estimatedFrameIntervalMs = window.VisiDAWRecorderProtocol
            .medianFrameInterval(recorderFrameIntervalsSeconds) * 1000;
          const fallbackDelayMs = Number.isFinite(Number(options.fallbackDelayMs))
            ? Math.max(0, Math.min(1900, Number(options.fallbackDelayMs) + 2 * estimatedFrameIntervalMs))
            : Math.min(1900, 100 + 2 * estimatedFrameIntervalMs);
          pendingCaptureBoundaryStop = { targetCaptureTimeMs: requestedAtMs };

          captureBoundaryFallbackTimer = setTimeout(() => {
            captureBoundaryFallbackTimer = null;
            if (pendingCaptureBoundaryStop && lastObservedCaptureTimeMs === null) {
              stopMediaRecorderNow();
            }
          }, fallbackDelayMs);
          captureBoundaryHardTimer = setTimeout(() => {
            captureBoundaryHardTimer = null;
            if (pendingCaptureBoundaryStop) {
              stopMediaRecorderNow();
            }
          }, 2000);

          if (!remote || typeof remote.requestVideoFrameCallback !== "function") {
            return;
          }
          beginRecorderFrameMonitor();
        } catch (error) {
          emitToVisiDAW({
            type: "error",
            message: error.message || error.name
          });
          activeVisiDAWRecordingTakeId = null;
        }
      };

      function candidateKey(candidate) {
        return [
          candidate.candidate || "",
          candidate.sdpMid || "",
          candidate.sdpMLineIndex ?? ""
        ].join("|");
      }

      async function postSignal(payload) {
        const response = await fetch("/api/signal?session=" + encodeURIComponent(session), {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });

        if (!response.ok) {
          throw new Error("signal returned " + response.status);
        }

        return response.json();
      }

      async function getSignal() {
        const response = await fetch("/api/signal?session=" + encodeURIComponent(session) + "&t=" + Date.now(), {
          cache: "no-store"
        });

        if (!response.ok) {
          throw new Error("signal returned " + response.status);
        }

        return response.json();
      }

      async function sendCandidate(candidate) {
        const payload = {
          type: "candidate",
          role: "desktop",
          candidate: candidate.toJSON ? candidate.toJSON() : candidate
        };

        if (!answerPosted) {
          queuedCandidates.push(payload);
          return;
        }

        await postSignal(payload);
      }

      async function flushQueuedCandidates() {
        const candidates = queuedCandidates;
        queuedCandidates = [];

        for (const candidate of candidates) {
          await postSignal(candidate);
        }
      }

      async function pollPhoneOffer() {
        if (!peer) {
          return;
        }

        try {
          const state = await getSignal();

          if (state.offer && !offerApplied) {
            await peer.setRemoteDescription(state.offer);
            offerApplied = true;

            const answer = await peer.createAnswer();
            await peer.setLocalDescription(answer);
            await postSignal({
              type: "answer",
              role: "desktop",
              description: peer.localDescription
            });

            answerPosted = true;
            await flushQueuedCandidates();
            setStatus("Answer sent. Connecting.");
          }

          for (const candidate of state.phoneCandidates || []) {
            const key = candidateKey(candidate);

            if (!addedPhoneCandidates.has(key)) {
              addedPhoneCandidates.add(key);
              await peer.addIceCandidate(candidate);
            }
          }
        } catch (error) {
          setStatus("Signal error: " + (error.message || error.name), "err");
        }
      }

      button.onclick = async () => {
        try {
          button.disabled = true;
          button.textContent = "Receiver Running";
          setStatus("Waiting for phone offer.");

          peer = new RTCPeerConnection({ iceServers });
          peer.ontrack = (event) => {
            if (event.streams && event.streams[0]) {
              remoteStream = event.streams[0];
              remote.srcObject = remoteStream;
            } else {
              remoteStream = new MediaStream([event.track]);
              remote.srcObject = remoteStream;
            }
          };
          peer.oniceconnectionstatechange = () => {
            const state = peer.iceConnectionState;
            const connected = state === "connected" || state === "completed";
            setStatus("WebRTC " + state + ".", connected ? "ok" : "");
          };
          peer.onicecandidate = (event) => {
            if (event.candidate) {
              sendCandidate(event.candidate).catch((error) => {
                setStatus("Candidate error: " + (error.message || error.name), "err");
              });
            }
          };

          setInterval(pollPhoneOffer, 700);
          pollPhoneOffer();
        } catch (error) {
          button.disabled = false;
          button.textContent = "Start Receiver";
          setStatus("Receiver error: " + (error.message || error.name), "err");
        }
      };

      if (autoStart) {
        window.addEventListener("load", () => {
          setTimeout(() => button.click(), 250);
        });
      }
    </script>
  </body>
</html>
